name: Centos8 Compatible Build (GStreamer 1.18)
on: workflow_dispatch

jobs:
  build-centos8:
    runs-on: ubuntu-latest
    container:
      image: fedora:34

    steps:
      - name: Install Build Tools, OpenSSL & GStreamer 1.18 Dev
        run: |
          dnf clean all
          dnf install -y \
            gcc \
            gcc-c++ \
            make \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            glib2-devel \
            pkgconfig \
            openssl-devel \
            wget \
            git \
            perl

      - name: Verify Environment
        run: |
          pkg-config --modversion gstreamer-1.0

      - name: Install Rust
        run: |
          # Внимание: здесь используется строго sh.rustup.rs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download & Build Plugin v0.15.4
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-download
          cargo download gst-plugin-ndi==0.15.4 --extract --output plugin-src
          cd plugin-src
          cargo build --release

      - name: Upload Finished So-File
        uses: actions/upload-artifact@v4
        with:
          name: libgstndi-centos8-compatible
          path: gst-plugins-rs/target/release/libgstndi.so
