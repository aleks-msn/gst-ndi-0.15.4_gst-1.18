name: Strict Rocky8 Build (GStreamer 1.18)
on: workflow_dispatch

jobs:
  build-centos8:
    runs-on: ubuntu-latest
    # Используем официальный Rocky Linux 8 (полный бинарный аналог CentOS 8)
    container:
      image: rockylinux:8

    steps:
      - name: Install Development Tools & GStreamer 1.18
        run: |
          # Включаем EPEL и репозиторий пакетов разработки (сначала пробуем powertools, затем crb)
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
          
          # 2. Добавляем кастомный репозиторий Ramonak 3.4, содержащий GStreamer 1.18
          cat <<EOF > /etc/yum.repos.d/ramonak.repo
          [ramonak-3.4]
          name=Ramonak 3.4 Repository for Rocky Linux 8
          baseurl=https://update.ramonak.pro/ramonak-3.4
          enabled=1
          gpgcheck=0
          EOF
          
          dnf clean all
          dnf makecache
          
          # Устанавливаем компиляторы и dev-пакеты
          dnf groupinstall -y "Development Tools"
          dnf install -y \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            glib2-devel \
            pkgconfig \
            openssl-devel \
            wget \
            git \
            perl

      - name: Verify Strict Environment (GLIBC 2.28 & GStreamer 1.18)
        run: |
          ldd --version # Должно показать GLIBC 2.28
          pkg-config --modversion gstreamer-1.0 # Покажет точную версию 1.18.x


      - name: Install Rust
        run: |
          # Внимание: здесь используется строго sh.rustup.rs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download & Build Plugin v0.15.4
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-download
          cargo download gst-plugin-ndi==0.15.4 --extract --output plugin-src
          cd plugin-src
          cargo build --release

      - name: Upload Finished So-File
        uses: actions/upload-artifact@v4
        with:
          name: libgstndi-centos8-compatible
          path: plugin-src/target/release/libgstndi.so
