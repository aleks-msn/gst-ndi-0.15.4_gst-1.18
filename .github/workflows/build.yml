name: Centos8 Compatible Build (GStreamer 1.18)
on: workflow_dispatch

jobs:
  build-centos8:
    runs-on: ubuntu-latest
    # Запускаем сборку внутри оригинального контейнера CentOS Stream 8
    container:
      image: tgagor/centos:stream8

    steps:
      - name: Fix EOL Repositories & Install Build Tools
        run: |
          # Переключаем упавшие официальные репозитории на архивный Vault CentOS
          sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*
          
          # Очищаем кэш и ставим инструменты разработки
          dnf clean all
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf groupinstall -y "Development Tools"
          
          # Устанавливаем строго GStreamer 1.18.x и OpenSSL для Rust
          dnf install -y \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            glib2-devel \
            pkgconfig \
            openssl-devel \
            wget \
            git \
            perl

      - name: Verify Strict CentOS 8 Environment
        run: |
          ldd --version # Должно показать строго GLIBC 2.28
          pkg-config --modversion gstreamer-1.0 # Должно показать строго 1.18.x

      - name: Install Rust
        run: |
          # Внимание: здесь используется строго sh.rustup.rs
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download & Build Plugin v0.15.4
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-download
          cargo download gst-plugin-ndi==0.15.4 --extract --output plugin-src
          cd plugin-src
          cargo build --release

      - name: Upload Finished So-File
        uses: actions/upload-artifact@v4
        with:
          name: libgstndi-centos8-compatible
          path: plugin-src/target/release/libgstndi.so
