name: Fixed Build gst-plugin-ndi 0.15.4 for CentOS 8
on: workflow_dispatch

jobs:
  build-centos8:
    runs-on: ubuntu-latest
    # Используем контейнер Fedora 34, где встроен GStreamer 1.18 и совместимый GLIBC
    container:
      image: fedora:34

    steps:
      - name: Install Build Tools & GStreamer 1.18 Dev
        run: |
          dnf clean all
          dnf install -y \
            gcc \
            gcc-c++ \
            make \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            glib2-devel \
            pkgconfig \
            wget \
            git

      - name: Verify Environment
        run: |
          pkg-config --modversion gstreamer-1.0

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download & Build Plugin v0.15.4
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-download
          cargo download gst-plugin-ndi==0.15.4 --extract --output plugin-src
          cd plugin-src
          cargo build --release

      - name: Upload Finished So-File
        uses: actions/upload-artifact@v4
        with:
          name: libgstndi-centos8-compatible
          path: plugin-src/target/release/libgstndi.so
